<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biz haqimizda — Maxi_by_MAXLIYO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
    --ink:#2B2118;
    --ink-soft:#5c4d3d;
    --cream:#FBF6EF;
    --cream-deep:#F3EADC;
    --blush:#F8C8DC;
    --blush-soft:#FFF0F5;
    --gold:#C5A059;
    --gold-bright:#E9CB82;
    --gold-deep:#9C7A32;
    --line:rgba(197,160,89,.28);
    --shadow:0 20px 60px -30px rgba(43,33,24,.35);
    --radius-lg:26px;
    --radius-sm:14px;
  }
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
    font-family:'Jost',sans-serif;
    color:var(--ink);
    background:var(--cream);
    overflow-x:hidden;
    font-weight:400;
    line-height:1.6;
  }
h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif;}
a{text-decoration:none;color:inherit;}
ul{list-style:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
img{max-width:100%;display:block;}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px;}
::selection{background:var(--gold);color:#fff;}
body::before{
    content:"";
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse 900px 500px at 8% 0%, var(--blush-soft) 0%, transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, #FDF0DF 0%, transparent 55%);
    z-index:-2;
    pointer-events:none;
  }
header{
    position:sticky;top:0;z-index:100;
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    background:rgba(251,246,239,.72);
    border-bottom:1px solid var(--line);
  }
.header-inner{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 40px;max-width:1320px;margin:0 auto;gap:32px;
  }
.brand{display:flex;align-items:center;gap:14px;}
.brand .mono{
    width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 28%, #a9793f, #6b4423 75%);
    box-shadow:0 6px 16px -6px rgba(107,68,35,.55), inset 0 0 0 1.5px rgba(233,203,130,.6);
    flex-shrink:0;
  }
.brand .mono svg{width:22px;height:22px;}
.brand-text{display:flex;flex-direction:column;line-height:1.15;}
.brand-text .name{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.4rem;letter-spacing:.01em;color:var(--ink);}
.brand-text .tag{font-size:.6rem;letter-spacing:.15em;color:var(--gold-deep);font-weight:600;margin-top:1px;}
nav.primary-nav{display:flex;gap:38px;flex:1;justify-content:center;}
nav.primary-nav a{
    font-size:.92rem;color:var(--ink);font-weight:500;position:relative;padding:4px 0;white-space:nowrap;
    transition:color .25s;
  }
nav.primary-nav a::after{
    content:"";position:absolute;left:0;bottom:-2px;width:0;height:1px;background:var(--gold-deep);
    transition:width .3s ease;
  }
nav.primary-nav a:hover{color:var(--gold-deep);}
nav.primary-nav a:hover::after{width:100%;}
.header-actions{display:flex;align-items:center;gap:26px;}
.search-box{
    display:flex;align-items:center;gap:10px;
    background:var(--cream);border:1px solid rgba(43,33,24,.1);border-radius:999px;
    padding:11px 20px;width:250px;transition:width .3s, box-shadow .3s, border-color .3s;
  }
.search-box:focus-within{width:280px;border-color:var(--gold);box-shadow:0 6px 20px -10px rgba(156,122,50,.4);}
.search-box input{border:none;outline:none;font-family:inherit;font-size:.88rem;width:100%;background:transparent;color:var(--ink);}
.search-box input::placeholder{color:#a89b89;}
.search-box svg{flex-shrink:0;opacity:.5;}
.icon-btn{position:relative;display:flex;align-items:center;justify-content:center;width:24px;height:24px;color:var(--ink);}
.icon-btn svg{width:22px;height:22px;transition:transform .25s;}
.icon-btn:hover svg{transform:translateY(-2px);color:var(--gold-deep);}
.badge{
    position:absolute;top:-6px;right:-8px;min-width:16px;height:16px;padding:0 3px;
    background:var(--gold-deep);color:#fff;font-size:.62rem;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-weight:600;
    transform:scale(0);transition:transform .3s cubic-bezier(.34,1.6,.64,1);
  }
.badge.show{transform:scale(1);}
.badge.pop{animation:pop .38s cubic-bezier(.34,1.6,.64,1);}
@keyframes pop{0%{transform:scale(1);}45%{transform:scale(1.5);}100%{transform:scale(1);}}
.burger{display:none;width:38px;height:38px;align-items:center;justify-content:center;}
.burger svg{width:22px;height:22px;}
.lang-switch{display:flex;gap:2px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;}
.lang-switch button{padding:6px 11px;border-radius:999px;font-size:.7rem;letter-spacing:.03em;color:var(--ink-soft);transition:.25s;font-weight:500;}
.lang-switch button.active{background:var(--ink);color:#fff;}
.acc-lang-block{margin-bottom:24px;}
.acc-lang-label{font-size:.72rem;letter-spacing:.1em;color:var(--ink-soft);margin-bottom:8px;text-transform:uppercase;}
.acc-lang-block .lang-switch{width:100%;}
.acc-lang-block .lang-switch button{flex:1;padding:9px 0;font-size:.76rem;}
.hero{position:relative;padding:88px 0 70px;overflow:hidden;}
.hero-grid{
    display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;
  }
.eyebrow-motto{
    display:inline-flex;align-items:center;gap:10px;
    font-size:.72rem;letter-spacing:.14em;color:var(--gold-deep);font-weight:500;
    margin-bottom:22px;
  }
.eyebrow-motto::before{content:"";width:26px;height:1px;background:var(--gold-deep);}
.hero h1{
    font-size:clamp(2.6rem,4.6vw,4.1rem);
    font-weight:500;
    line-height:1.05;
    background:linear-gradient(100deg,#8f6f2c 0%, var(--gold) 22%, var(--gold-bright) 45%, var(--gold-deep) 68%, var(--gold) 100%);
    background-size:220% auto;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    animation:shine 7s linear infinite;
    letter-spacing:.005em;
  }
@keyframes shine{to{background-position:220% center;}}
.hero p.lede{
    margin-top:24px;max-width:480px;color:var(--ink-soft);font-size:1.04rem;
  }
.hero-ctas{display:flex;gap:16px;margin-top:38px;flex-wrap:wrap;}
.btn-shine{
    position:relative;overflow:hidden;
    padding:16px 34px;border-radius:999px;
    background:linear-gradient(120deg,var(--gold-deep),var(--gold),var(--gold-bright),var(--gold));
    background-size:280% auto;
    color:#fff;font-size:.92rem;letter-spacing:.03em;font-weight:500;
    box-shadow:0 18px 40px -18px rgba(156,122,50,.75);
    animation:shine 6s linear infinite;
    transition:transform .3s;
  }
.btn-shine:hover{transform:translateY(-2px);}
.btn-outline{
    padding:16px 30px;border-radius:999px;border:1px solid var(--gold-deep);
    color:var(--gold-deep);font-size:.92rem;font-weight:500;transition:.3s;
  }
.btn-outline:hover{background:var(--gold-deep);color:#fff;}
.hero-visual{position:relative;display:flex;align-items:center;justify-content:center;height:420px;}
.ring{
    position:absolute;border-radius:50%;border:1px solid var(--line);
  }
.ring.r1{width:380px;height:380px;animation:spin 40s linear infinite;}
.ring.r2{width:300px;height:300px;border-style:dashed;animation:spin 60s linear infinite reverse;}
@keyframes spin{to{transform:rotate(360deg);}}
.hero-mono{
    width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--cream-deep) 70%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 30px 70px -25px rgba(156,122,50,.55), inset 0 0 0 1px var(--line);
  }
.hero-mono svg{width:96px;height:96px;}
.orbit-dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--gold-bright);box-shadow:0 0 12px var(--gold);}
.glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(233,203,130,.4),transparent 70%);filter:blur(10px);z-index:-1;}
.motto-strip{
    margin-top:64px;padding-top:36px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;
  }
.motto-strip .words{font-size:.78rem;letter-spacing:.2em;color:var(--gold-deep);font-weight:500;}
.motto-strip .desc{max-width:420px;color:var(--ink-soft);font-size:.92rem;text-align:right;}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s ease, transform .8s ease;}
.reveal.in{opacity:1;transform:translateY(0);}
.section{padding:90px 0;}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:44px;gap:24px;flex-wrap:wrap;}
.section-head h2{font-size:clamp(1.9rem,3vw,2.6rem);font-weight:500;}
.section-head p{color:var(--ink-soft);max-width:380px;font-size:.94rem;}
.bento{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    grid-auto-rows:150px;
    gap:18px;
  }
.cat-card{
    position:relative;border-radius:var(--radius-lg);overflow:hidden;
    background:linear-gradient(155deg,#fff, var(--cream-deep));
    border:1px solid var(--line);
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:22px;
    cursor:pointer;
    transition:transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s;
  }
.cat-card:hover{transform:translateY(-6px);box-shadow:var(--shadow);}
.cat-card .icon-wrap{
    position:absolute;top:20px;left:20px;width:44px;height:44px;border-radius:50%;
    background:var(--blush-soft);display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);
  }
.cat-card .icon-wrap svg{width:22px;height:22px;stroke:var(--gold-deep);}
.cat-card .cat-name{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:600;}
.cat-card .cat-name-en{font-size:.66rem;letter-spacing:.14em;color:var(--gold-deep);margin-top:2px;}
.cat-card::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 40%, rgba(43,33,24,.06) 100%);
    opacity:0;transition:opacity .4s;
  }
.cat-card:hover::before{opacity:1;}
.cat-card.big{grid-column:span 3;grid-row:span 2;}
.cat-card.wide{grid-column:span 2;}
.cat-card.reg{grid-column:span 2;}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:38px;}
.pill{
    padding:10px 20px;border-radius:999px;border:1px solid var(--line);
    font-size:.82rem;color:var(--ink-soft);transition:.3s;background:#fff;
  }
.pill.active,.pill:hover{background:var(--ink);color:#fff;border-color:var(--ink);}
.product-grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:26px;
  }
.p-card{
    background:#fff;border-radius:var(--radius-lg);border:1px solid var(--line);
    overflow:hidden;transition:transform .4s, box-shadow .4s;
  }
.p-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);}
.p-media{
    position:relative;aspect-ratio:1/1;
    background:linear-gradient(150deg,var(--blush-soft),var(--cream-deep));
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
.p-media svg{width:52%;height:52%;stroke:var(--gold-deep);opacity:.85;transition:transform .55s cubic-bezier(.2,.8,.2,1);}
.p-card:hover .p-media svg{transform:scale(1.12) rotate(-2deg);}
.p-wish{
    position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.85);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
    transition:transform .25s;
  }
.p-wish:hover{transform:scale(1.1);}
.p-wish svg{width:16px;height:16px;stroke:var(--gold-deep);fill:none;transition:fill .25s,stroke .25s;}
.p-wish.active svg{fill:var(--gold-deep);}
.p-quick{
    position:absolute;left:0;right:0;bottom:0;
    display:flex;justify-content:center;padding:14px;
    background:linear-gradient(0deg,rgba(43,33,24,.55),transparent);
    transform:translateY(100%);opacity:0;transition:transform .4s ease, opacity .4s ease;
  }
.p-card:hover .p-quick{transform:translateY(0);opacity:1;}
.p-quick button{
    background:#fff;color:var(--ink);padding:9px 18px;border-radius:999px;font-size:.76rem;letter-spacing:.03em;
  }
.p-body{padding:18px 20px 22px;}
.p-cat{font-size:.66rem;letter-spacing:.12em;color:var(--gold-deep);margin-bottom:6px;}
.p-name{font-family:'Cormorant Garamond',serif;font-size:1.18rem;font-weight:600;margin-bottom:6px;}
.p-stars{display:flex;gap:2px;margin-bottom:10px;}
.p-stars svg{width:13px;height:13px;fill:var(--gold);stroke:none;}
.p-stars svg.empty{fill:var(--line);}
.p-foot{display:flex;align-items:center;justify-content:space-between;}
.p-price{font-weight:500;font-size:1.02rem;}
.p-price small{display:block;font-size:.66rem;color:var(--ink-soft);font-weight:400;}
.p-add{
    width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;transition:.3s;
  }
.p-add:hover{background:var(--gold-deep);}
.p-add svg{width:16px;height:16px;}
.no-results{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--ink-soft);}
.promo{
    margin:20px 0;border-radius:var(--radius-lg);
    background:linear-gradient(120deg,#3A2E1F,#5b4526 55%,#3A2E1F);
    color:#F6EBD6;padding:60px 50px;display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap;
    position:relative;overflow:hidden;
  }
.promo::after{
    content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle,rgba(233,203,130,.25),transparent 70%);
  }
.promo h3{font-size:clamp(1.6rem,2.6vw,2.2rem);font-weight:500;max-width:520px;}
.promo p{color:#D9C9A8;margin-top:10px;font-size:.92rem;max-width:440px;}
footer{background:var(--ink);color:#E9DEC9;padding:70px 0 26px;margin-top:40px;}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.1fr;gap:40px;padding-bottom:50px;border-bottom:1px solid rgba(233,203,130,.15);}
.foot-brand .brand-text .name{color:#fff;}
.foot-brand p{color:#c9bda3;font-size:.88rem;margin-top:14px;max-width:280px;}
footer h4{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:600;margin-bottom:16px;color:#F6EBD6;}
footer ul li{margin-bottom:10px;}
footer ul li a{color:#c9bda3;font-size:.88rem;transition:color .25s;}
footer ul li a:hover{color:var(--gold-bright);}
.foot-social{display:flex;gap:12px;margin-top:16px;}
.foot-social a{width:34px;height:34px;border-radius:50%;border:1px solid rgba(233,203,130,.3);display:flex;align-items:center;justify-content:center;transition:.3s;}
.foot-social a:hover{background:var(--gold);border-color:var(--gold);}
.foot-social svg{width:15px;height:15px;stroke:#E9DEC9;}
.foot-bottom{display:flex;justify-content:space-between;padding-top:24px;font-size:.78rem;color:#8f8267;flex-wrap:wrap;gap:10px;}
.promo-box{margin-bottom:18px;}
.promo-input-row{display:flex;gap:8px;width:100%;}
.promo-input-row input{
    flex:1 1 auto;min-width:0;font-family:inherit;font-size:.85rem;padding:12px 15px;border-radius:999px;
    border:1px solid var(--line);background:#fff;outline:none;color:var(--ink);
    transition:border-color .25s, box-shadow .25s;
  }
.promo-input-row input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(197,160,89,.15);}
.promo-input-row input.shake{animation:shake .4s;}
@keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
  }
.promo-input-row button{
    width:auto;padding:10px 14px;border-radius:999px;background:var(--ink);color:#fff;font-size:.72rem;
    flex:0 0 auto;white-space:nowrap;transition:background .25s;
  }
.promo-input-row button:hover{background:var(--gold-deep);}
.promo-error{
    font-size:.76rem;color:#b5493f;margin-top:8px;opacity:0;height:0;overflow:hidden;transition:opacity .25s, height .25s;
  }
.promo-error.show{opacity:1;height:auto;margin-top:8px;}
.promo-applied{
    display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 14px;border-radius:12px;
    background:linear-gradient(120deg,var(--blush-soft),#FDF0DF);border:1px solid var(--line);
    font-size:.8rem;color:var(--ink-soft);
    transform:scale(.85);opacity:0;height:0;overflow:hidden;
  }
.promo-applied.show{
    transform:scale(1);opacity:1;height:auto;padding:10px 14px;margin-top:10px;
    animation:promoPop .5s cubic-bezier(.34,1.6,.64,1);
    transition:opacity .3s, transform .3s;
  }
@keyframes promoPop{
    0%{transform:scale(.6);opacity:0;}
    55%{transform:scale(1.08);opacity:1;}
    100%{transform:scale(1);opacity:1;}
  }
.promo-percent{
    font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.15rem;color:var(--gold-deep);
  }
.promo-remove{margin-left:auto;cursor:pointer;color:var(--ink-soft);font-size:.75rem;}
#cartSubtotal{text-decoration:line-through;color:var(--ink-soft);}
.pd-label{font-size:.74rem;letter-spacing:.08em;color:var(--ink-soft);margin:14px 0 8px;text-transform:uppercase;}
.pd-label b{color:var(--ink);font-weight:500;}
.pd-chips{display:flex;flex-wrap:wrap;gap:8px;}
.pd-chip{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:.82rem;color:var(--ink);transition:.25s;}
.pd-chip:hover{border-color:var(--gold);}
.pd-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.pd-buy{display:flex;align-items:center;gap:10px;margin:20px 0 6px;flex-wrap:wrap;}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:#fff;}
.qty button{width:34px;height:38px;font-size:1.05rem;color:var(--ink);}
.qty span{min-width:26px;text-align:center;font-size:.9rem;font-weight:500;}
.pd-buy .btn-shine,.pd-buy .btn-dark{padding:13px 22px;border-radius:999px;font-size:.84rem;}
.btn-dark{background:var(--ink);color:#fff;transition:background .25s;}
.btn-dark:hover{background:var(--gold-deep);}
.pd-wish{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--gold-deep);background:#fff;}
.pd-list{margin:6px 0 0;}
.pd-list li{position:relative;padding-left:20px;margin-bottom:8px;font-size:.88rem;color:var(--ink-soft);}
.pd-list li::before{content:"";position:absolute;left:2px;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--gold);}
.spec-table{width:100%;border-collapse:collapse;font-size:.88rem;}
.spec-table td{padding:11px 0;border-bottom:1px solid var(--line);vertical-align:top;}
.spec-table td:first-child{color:var(--ink-soft);width:42%;padding-right:12px;}
.rev-sum{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.rev-sum strong{font-family:'Cormorant Garamond',serif;font-size:2.2rem;color:var(--gold-deep);font-weight:600;line-height:1;}
.rev-sum .p-stars{margin:0 0 4px;}
.rev-sum small{color:var(--ink-soft);font-size:.78rem;}
.rev-form{margin-top:18px;padding:18px;border:1px dashed var(--line);border-radius:var(--radius-sm);background:var(--blush-soft);display:flex;flex-direction:column;gap:10px;}
.rev-form h4{font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:600;}
.rev-form input,.rev-form textarea,.co-form input,.co-form textarea{font-family:inherit;font-size:.88rem;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;outline:none;color:var(--ink);resize:none;transition:border-color .25s, box-shadow .25s;width:100%;}
.rev-form input:focus,.rev-form textarea:focus,.co-form input:focus,.co-form textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(197,160,89,.15);}
.star-input{display:flex;gap:4px;align-items:center;}
.star-input button{font-size:1.5rem;line-height:1;color:var(--line);transition:color .2s, transform .2s;}
.star-input button.on{color:var(--gold);}
.star-input button:hover{transform:scale(1.15);}
.rev-form .btn-dark{padding:12px;border-radius:999px;font-size:.84rem;}
.p-meta{font-size:.74rem;color:var(--ink-soft);margin:-2px 0 8px;}
.p-count{font-size:.72rem;color:var(--ink-soft);margin-left:6px;align-self:center;}
.p-stars{align-items:center;}
.p-card{cursor:pointer;}
.co-form{display:flex;flex-direction:column;gap:12px;}
.co-form label{font-size:.74rem;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:-6px;}
.co-pay{display:flex;gap:8px;}
.co-pay label{flex:1;margin:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:.84rem;color:var(--ink);letter-spacing:0;cursor:pointer;}
.co-pay input{width:auto;accent-color:var(--gold-deep);}
.co-pay label.on{border-color:var(--gold-deep);background:var(--blush-soft);}
.co-sum{background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:16px;font-size:.86rem;}
.co-sum .row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;color:var(--ink-soft);}
.co-sum .row span:last-child{white-space:nowrap;color:var(--ink);}
.co-sum .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:500;color:var(--ink);}
.co-sum .tot span{color:var(--ink) !important;font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:600;}
.co-error{color:#b5493f;font-size:.82rem;display:none;}
.co-error.show{display:block;}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;vertical-align:-2px;margin-right:8px;}
.review-card{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:20px 22px;margin-bottom:16px;
  }
.review-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.review-avatar{
    width:38px;height:38px;border-radius:50%;flex-shrink:0;
    background:conic-gradient(from 180deg,var(--gold-bright),var(--gold),var(--gold-deep));
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Cormorant Garamond',serif;font-weight:600;
  }
.review-name{font-weight:500;font-size:.92rem;}
.review-cat{font-size:.7rem;color:var(--ink-soft);}
.review-card .p-stars{margin-bottom:8px;}
.review-card p{font-size:.88rem;margin-bottom:0;}
.contact-info{display:flex;flex-direction:column;gap:14px;margin:26px 0 34px;}
.contact-row{display:flex;align-items:center;gap:14px;font-size:.9rem;}
.contact-row .ic{
    width:38px;height:38px;border-radius:50%;background:var(--blush-soft);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
.contact-row .ic svg{width:16px;height:16px;stroke:var(--gold-deep);}
.contact-form{display:flex;flex-direction:column;gap:14px;}
.contact-form label{font-size:.76rem;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:-8px;}
.contact-form input,.contact-form textarea{
    font-family:inherit;font-size:.9rem;padding:13px 16px;border-radius:12px;
    border:1px solid var(--line);background:#fff;outline:none;resize:none;color:var(--ink);
    transition:border-color .25s, box-shadow .25s;
  }
.contact-form input:focus,.contact-form textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(197,160,89,.15);}
.contact-form button{margin-top:6px;padding:15px;border-radius:999px;}
.contact-sent{
    display:flex;align-items:center;gap:10px;background:var(--blush-soft);border:1px solid var(--line);
    padding:14px 18px;border-radius:12px;font-size:.86rem;margin-top:14px;opacity:0;height:0;overflow:hidden;
    transition:opacity .3s, height .3s;
  }
.contact-sent.show{opacity:1;height:auto;padding:14px 18px;}
.contact-sent svg{width:16px;height:16px;stroke:var(--gold-deep);flex-shrink:0;}
.toast{
    position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#F6EBD6;padding:14px 26px;border-radius:999px;font-size:.85rem;
    opacity:0;transition:opacity .35s, transform .35s;z-index:300;display:flex;align-items:center;gap:10px;
  }
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast svg{width:15px;height:15px;stroke:var(--gold-bright);}
@media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }

/* ===================== multi-page additions ===================== */
.header-inner{position:relative;}
nav.primary-nav a.active{color:var(--gold-deep);}
nav.primary-nav a.active::after{width:100%;}
a.icon-btn{text-decoration:none;}
.icon-btn.active{color:var(--gold-deep);}
@media (max-width:760px){
  header.nav-open nav.primary-nav{display:flex;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:var(--cream);padding:18px 24px 22px;border-bottom:1px solid var(--line);gap:14px;align-items:flex-start;box-shadow:0 20px 40px -24px rgba(43,33,24,.3);}
}
.lang-switch{display:flex;gap:2px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;}
.lang-switch button{flex:1;padding:9px 0;border-radius:999px;font-size:.78rem;letter-spacing:.03em;color:var(--ink-soft);transition:.25s;font-weight:500;}
.lang-switch button.active{background:var(--ink);color:#fff;}

/* cards */
.p-card{position:relative;cursor:default;}
.p-card .p-wish{top:14px;right:14px;z-index:2;}
.p-media{text-decoration:none;}
.p-name{display:block;}
.p-name:hover{color:var(--gold-deep);}
.p-quick .qk{background:#fff;color:var(--ink);padding:9px 18px;border-radius:999px;font-size:.76rem;letter-spacing:.03em;}
.p-stars{display:flex;gap:2px;align-items:center;}

/* inner page head */
.page-head{padding:54px 0 6px;}
.crumbs{font-size:.8rem;color:var(--ink-soft);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.crumbs a:hover{color:var(--gold-deep);}
.crumbs .sep{opacity:.45;}
.page-title{font-size:clamp(2rem,4vw,3.1rem);font-weight:500;line-height:1.1;}
.page-sub{color:var(--ink-soft);max-width:640px;margin-top:12px;}
.page-main{padding-bottom:30px;min-height:55vh;}
.sec-title{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:500;margin:0 0 20px;}

/* index features / steps */
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.feat{display:block;background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px 26px;transition:transform .4s, box-shadow .4s;}
.feat:hover{transform:translateY(-5px);box-shadow:var(--shadow);}
.feat .ic{width:48px;height:48px;border-radius:50%;background:var(--blush-soft);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
.feat .ic svg{width:22px;height:22px;stroke:var(--gold-deep);}
.feat h3{font-size:1.4rem;font-weight:600;margin-bottom:8px;line-height:1.2;}
.feat p{color:var(--ink-soft);font-size:.9rem;}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;}
.step{padding:24px 6px 0;border-top:1px solid var(--gold);}
.step .n{font-family:'Cormorant Garamond',serif;font-size:3.2rem;line-height:1;color:var(--gold);margin-bottom:10px;}
.step h3{font-size:1.35rem;margin-bottom:6px;}
.step p{color:var(--ink-soft);font-size:.9rem;}
.more-row{text-align:center;margin-top:34px;}
.btn-line{display:inline-block;padding:14px 30px;border-radius:999px;border:1px solid var(--gold-deep);color:var(--gold-deep);font-size:.9rem;font-weight:500;transition:.3s;}
.btn-line:hover{background:var(--gold-deep);color:#fff;}
a.btn-shine{display:inline-block;text-align:center;}

/* catalog toolbar */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:26px 0 18px;}
.tb-search{flex:1 1 260px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:11px 18px;}
.tb-search input{border:none;outline:none;background:transparent;width:100%;font:inherit;font-size:.9rem;color:var(--ink);}
.tb-select{padding:11px 18px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;font-size:.86rem;color:var(--ink);outline:none;}
.count{font-size:.84rem;color:var(--ink-soft);margin-left:auto;}

/* product page */
.pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:10px;align-items:start;}
.pd-media{position:relative;aspect-ratio:1/1;border-radius:var(--radius-lg);background:linear-gradient(150deg,var(--blush-soft),var(--cream-deep));border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
.pd-media svg{width:46%;height:46%;stroke:var(--gold-deep);}
.pd-badge{position:absolute;left:18px;top:18px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.72rem;letter-spacing:.08em;color:var(--gold-deep);}
.pd-cat{font-size:.74rem;letter-spacing:.14em;color:var(--gold-deep);}
.pd-title{font-size:clamp(1.9rem,3.4vw,2.9rem);font-weight:600;line-height:1.1;margin:6px 0 12px;}
.pd-rate{display:inline-flex;align-items:center;gap:10px;font-size:.84rem;color:var(--ink-soft);cursor:pointer;}
.pd-price{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:600;margin:12px 0 4px;}
.avail{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;color:#4f7a4a;margin-bottom:6px;}
.avail::before{content:"";width:8px;height:8px;border-radius:50%;background:#6aa564;}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px;}
.fact{background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;}
.fact small{display:block;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:3px;}
.fact b{font-weight:500;font-size:.9rem;line-height:1.3;display:block;}
.pd-sec{margin-top:56px;}
.pd-sec h2{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:500;margin-bottom:18px;}
.pd-sec p{color:var(--ink-soft);font-size:.96rem;margin-bottom:12px;max-width:760px;}
.pd-reviews{display:grid;grid-template-columns:1.2fr .8fr;gap:34px;align-items:start;}
.pd-page .review-card{margin-bottom:12px;}
.pd-buy{margin:20px 0 6px;}
.btn-dark{background:var(--ink);color:#fff;transition:background .25s;}
.btn-dark:hover{background:var(--gold-deep);}
.pd-buy .btn-shine,.pd-buy .btn-dark{padding:13px 24px;border-radius:999px;font-size:.86rem;}
.related-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}

/* cart */
.cart-layout{display:grid;grid-template-columns:1.45fr 1fr;gap:34px;align-items:start;margin-top:26px;}
.cart-list{display:flex;flex-direction:column;gap:14px;}
.cart-item{display:grid;grid-template-columns:96px 1fr auto;gap:18px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;}
.cart-item .th{width:96px;height:96px;border-radius:18px;background:linear-gradient(150deg,var(--blush-soft),var(--cream-deep));display:flex;align-items:center;justify-content:center;}
.cart-item .th svg{width:50%;height:50%;stroke:var(--gold-deep);}
.cart-item .nm{font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:600;line-height:1.2;display:block;}
.cart-item .vl{font-size:.78rem;color:var(--gold-deep);}
.cart-item .un{font-size:.84rem;color:var(--ink-soft);margin:2px 0 8px;}
.cart-item .sum{font-weight:500;font-size:1.05rem;white-space:nowrap;text-align:right;}
.cart-item .rm{font-size:.76rem;color:var(--ink-soft);margin-top:8px;cursor:pointer;display:inline-block;}
.cart-item .rm:hover{color:#b5493f;}
.sum-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:26px;}
.cart-side{position:sticky;top:96px;display:flex;flex-direction:column;gap:18px;}
.sum-card h3{font-size:1.5rem;margin-bottom:14px;}
.sum-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:.92rem;color:var(--ink-soft);}
.sum-row span:last-child{color:var(--ink);text-align:right;}
.sum-row.tot{border-top:1px solid var(--line);margin-top:8px;padding-top:14px;color:var(--ink);}
.sum-row.tot b{font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:600;}
.cart-tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.link-btn{font-size:.82rem;color:var(--gold-deep);cursor:pointer;}
.link-btn:hover{text-decoration:underline;}
.cart-empty{text-align:center;padding:70px 20px;color:var(--ink-soft);}
.cart-empty h3{font-size:1.8rem;color:var(--ink);margin-bottom:8px;font-weight:500;}
.cart-empty .btn-shine{margin-top:20px;padding:14px 32px;border-radius:999px;}
.co-success{text-align:center;padding:50px 10px;max-width:560px;margin:0 auto;}
.co-check{width:80px;height:80px;border-radius:50%;margin:0 auto 20px;background:linear-gradient(135deg,var(--gold-bright),var(--gold-deep));display:flex;align-items:center;justify-content:center;animation:promoPop .6s cubic-bezier(.34,1.6,.64,1);}
.co-check svg{width:36px;height:36px;stroke:#fff;}
.co-success h2{font-size:2rem;font-weight:500;margin-bottom:8px;}
.co-success p{color:var(--ink-soft);margin-bottom:6px;}
.co-success .no{display:inline-block;margin:12px 0 24px;padding:8px 18px;border-radius:999px;background:var(--blush-soft);border:1px solid var(--line);font-weight:500;letter-spacing:.06em;}
.co-success .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.promo-applied.show.static{animation:none;}

/* profile */
.prof-grid{display:grid;grid-template-columns:350px 1fr;gap:34px;align-items:start;margin-top:26px;}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:26px;}
.prof-side{display:flex;flex-direction:column;gap:18px;position:sticky;top:96px;}
.avatar{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;background:conic-gradient(from 180deg,var(--gold-bright),var(--gold),var(--gold-deep));display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:2.2rem;}
.prof-name{text-align:center;font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:600;}
.prof-sub{text-align:center;color:var(--ink-soft);font-size:.84rem;margin-bottom:6px;}
.stat-row{display:flex;justify-content:space-between;gap:8px;margin:18px 0;text-align:center;}
.stat-row div{flex:1;}
.stat-row strong{display:block;font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--gold-deep);line-height:1.2;}
.stat-row span{font-size:.64rem;letter-spacing:.06em;color:var(--ink-soft);}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.field label{font-size:.74rem;letter-spacing:.06em;color:var(--ink-soft);}
.field input,.field textarea{font:inherit;font-size:.9rem;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;outline:none;color:var(--ink);resize:none;transition:border-color .25s, box-shadow .25s;width:100%;}
.field input:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(197,160,89,.15);}
.card h3{font-size:1.4rem;margin-bottom:14px;}
.acc-lang-label{font-size:.72rem;letter-spacing:.1em;color:var(--ink-soft);margin-bottom:8px;text-transform:uppercase;}
.order-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px 22px;margin-bottom:16px;}
.order-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.order-no{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:600;}
.order-date{font-size:.8rem;color:var(--ink-soft);}
.chip-st{padding:4px 12px;border-radius:999px;background:var(--blush-soft);border:1px solid var(--line);font-size:.72rem;color:var(--gold-deep);}
.order-line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:.88rem;}
.order-line span:last-child{white-space:nowrap;}
.order-meta{font-size:.82rem;color:var(--ink-soft);margin-top:10px;}
.order-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:12px;flex-wrap:wrap;}
.order-total{font-family:'Cormorant Garamond',serif;font-size:1.45rem;font-weight:600;}
.btn-sm{padding:9px 18px;border-radius:999px;font-size:.8rem;border:1px solid var(--gold-deep);color:var(--gold-deep);transition:.25s;background:transparent;}
.btn-sm:hover{background:var(--gold-deep);color:#fff;}
.prof-sec{margin-bottom:44px;}
.saved-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
.note{font-size:.78rem;color:var(--ink-soft);margin-top:10px;}

/* about */
.about-stats{display:flex;gap:44px;flex-wrap:wrap;margin:26px 0;}
.about-stats div{display:flex;flex-direction:column;}
.about-stats strong{font-family:'Cormorant Garamond',serif;font-size:2.4rem;color:var(--gold-deep);font-weight:600;line-height:1.1;}
.about-stats span{font-size:.72rem;color:var(--ink-soft);letter-spacing:.06em;}
.about-text p{color:var(--ink-soft);margin-bottom:14px;max-width:760px;}
.values{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.value{padding:30px 26px;background:linear-gradient(155deg,#fff,var(--cream-deep));border:1px solid var(--line);border-radius:var(--radius-lg);}
.value h3{font-size:1.7rem;color:var(--gold-deep);margin-bottom:8px;}
.value p{color:var(--ink-soft);font-size:.92rem;}
.reviews-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.reviews-grid .review-card{margin:0;}
.faq details{background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px 20px;margin-bottom:10px;}
.faq summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:12px;}

/* ---------------- Uzbek Latin -> Cyrillic transliteration ---------------- */
function transliterateWord(word){
  const firstIsUpper = word.length>0 && word[0] === word[0].toUpperCase() && word[0] !== word[0].toLowerCase();
  const lower = word.toLowerCase();
  const map3 = {"yo'":"йў"};
  const map2 = {"o'":"ў","g'":"ғ","sh":"ш","ch":"ч","ng":"нг","ya":"я","yo":"ё","yu":"ю","ye":"е"};
  const map1 = {a:"а",b:"б",d:"д",e:"е",f:"ф",g:"г",h:"ҳ",i:"и",j:"ж",k:"к",l:"л",m:"м",n:"н",o:"о",p:"п",q:"қ",r:"р",s:"с",t:"т",u:"у",v:"в",x:"х",y:"й",z:"з",c:"с","'":"ъ","’":"ъ"};
  let result = "", i = 0;
  while(i < lower.length){
    const three = lower.substr(i,3);
    if(map3[three]){ result += map3[three]; i+=3; continue; }
    const two = lower.substr(i,2);
    if(map2[two]){ result += map2[two]; i+=2; continue; }
    const one = lower[i];
    result += (map1[one] !== undefined ? map1[one] : one);
    i+=1;
  }
  if(firstIsUpper && result.length) result = result[0].toUpperCase() + result.slice(1);
  return result;
}
const KEEP_RE = /Maxi_by_MAXLIYO|Bluetooth|SpO₂|USB-[CA]|mAh|\bGB\b|\bATM\b|OLED|TPE|Full HD|microSD|G-sensor|UV400|IPX?\d+|18K|Extra Virgin|Eau de Parfum|Rose Gold|\bPro\b|\b(?:XS|S|M|L|XL)\b|\bA\d\b/g;
function uzToCyr(text){
  if(!text) return text;
  const kept = [];
  let s = String(text).replace(KEEP_RE, m => { kept.push(m); return "\u0001" + (kept.length-1) + "\u0001"; });
  s = s.replace(/[A-Za-z']+/g, w => transliterateWord(w));
  return s.replace(/\u0001(\d+)\u0001/g, (_, i) => kept[+i]);
}

function t(key){
  const dict = currentLang === "ru" ? I18N.ru : I18N.uz;
  const val = dict[key] !== undefined ? dict[key] : key;
  return currentLang === "cyrl" ? uzToCyr(val) : val;
}

const EXTRA = {};
EXTRA_DSL.trim().split("\n").forEach(line=>{
  const parts = line.split("|");
  const id = parseInt(parts[0],10);
  const e = {vkey:(parts[1]||"").trim(), variants:[], def:parseInt(parts[3]||"0",10)||0, specs:[]};
  if(parts[2]) parts[2].split(",").forEach(it=>{
    const a = it.split(":");
    e.variants.push({l:a[0].trim(), m:a[1]?parseFloat(a[1]):1, r:a[2]?a[2].trim():""});
  });
  if(parts[4]) parts[4].split(";").forEach(s=>{
    const i = s.indexOf("=");
    const v = s.slice(i+1).split("~");
    e.specs.push({k:s.slice(0,i).trim(), uz:v[0].trim(), ru:v[1]!==undefined?v[1].trim():null});
  });
  EXTRA[id] = e;
});

function extraOf(p){ return EXTRA[p.id] || {vkey:"", variants:[], def:0, specs:[]}; }
function defVi(p){ return extraOf(p).def || 0; }
function hasVariants(p){ return extraOf(p).variants.length > 0; }
function unitPrice(p, vi){
  const v = extraOf(p).variants[vi];
  const m = v ? v.m : 1;
  return m === 1 ? p.price : Math.round(p.price * m / 1000) * 1000;
}
function ruUnits(s){
  return s.replace(/\bml\b/g,"мл").replace(/\bkg\b/g,"кг").replace(/\bsm\b/g,"см").replace(/\bmm\b/g,"мм")
          .replace(/\bg\b/g,"г").replace(/\bl\b/g,"л").replace(/\bdona\b/g,"шт.").replace(/\bta\b/g,"шт.");
}
function vLabelRu(v){ return v.r || ruUnits(v.l); }
function vLabel(v){
  if(currentLang === "ru") return vLabelRu(v);
  if(currentLang === "cyrl") return uzToCyr(v.l);
  return v.l;
}
function specLabel(k){
  const L = (currentLang === "ru" ? SPEC_LABELS.ru : SPEC_LABELS.uz)[k] || k;
  return currentLang === "cyrl" ? uzToCyr(L) : L;
}
function specVal(s){
  if(currentLang === "ru") return s.ru !== null ? s.ru : s.uz;
  if(currentLang === "cyrl") return s.ru !== null ? uzToCyr(s.uz) : s.uz;
  return s.uz;
}
function catAbout(cat){
  const a = CAT_ABOUT[cat]; if(!a) return "";
  return currentLang === "ru" ? a.ru : (currentLang === "cyrl" ? uzToCyr(a.uz) : a.uz);
}
function nameFor(n){ return currentLang === "uz" ? n : uzToCyr(n); }
function reviewsFor(p){
  const fives = REVIEW_POOL.filter(r=>r.r===5), fours = REVIEW_POOL.filter(r=>r.r===4);
  const pick = (arr, n, seed)=>{ const out=[]; for(let i=0;i<n;i++) out.push(arr[(seed+i*2)%arr.length]); return out; };
  const base = p.rating >= 5 ? pick(fives,3,p.id).concat(pick(fours,1,p.id+1)) : pick(fours,2,p.id).concat(pick(fives,1,p.id+3));
  return (userReviews[p.id] || []).concat(base);
}
function avgOf(revs){ return revs.length ? revs.reduce((a,r)=>a+r.r,0)/revs.length : 0; }

function longDesc(p){
  const d = LONG_DESC[p.id]; if(!d) return pDesc(p);
  return currentLang === "ru" ? d.ru : (currentLang === "cyrl" ? uzToCyr(d.uz) : d.uz);
}

function starsHTML(rating){
  let s = "";
  for(let i=1;i<=5;i++){
    s += `<svg class="${i<=rating?'':'empty'}" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9.5 17,14.5 18.5,22 12,18 5.5,22 7,14.5 2,9.5 9,9"/></svg>`;
  }
  return s;
}

function avgRating(){
  const sum = REVIEWS.reduce((a,r)=>a+r.rating,0);
  return (sum/REVIEWS.length).toFixed(1);
}



/* ======================= shared logic ======================= */
const PAGE = document.body.dataset.page || "index";
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => [...(root || document).querySelectorAll(sel)];
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function getParam(name){ return new URLSearchParams(location.search).get(name); }

function applyStaticI18n(){
  $$("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  $$("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
}
function specOf(p, key){
  const s = extraOf(p).specs.find(x => x.k === key);
  return s ? specVal(s) : "";
}

/* ---------------- toast ---------------- */
let toastTimer;
function showToast(msg){
  const el = $("#toast");
  el.style.bottom = ($(".pd-sticky") && window.innerWidth <= 760) ? "88px" : "";
  $("#toastMsg").textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

/* ---------------- badges ---------------- */
function syncBadges(pop){
  const set = (id, n, doPop) => {
    const b = $(id); if(!b) return;
    b.textContent = n;
    b.classList.toggle("show", n > 0);
    if(doPop){ b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); }
  };
  set("#wishBadge", wishlist.size, pop === "wish");
  set("#cartBadge", Object.values(cart).reduce((a, b) => a + b, 0), pop === "cart");
}

/* ---------------- cart ---------------- */
function cartKey(id, vi){ return id + ":" + vi; }
function addToCart(id, vi, qty, silent){
  const p = PRODUCTS.find(x => x.id === id);
  if(vi === null || vi === undefined) vi = defVi(p);
  const k = cartKey(id, vi);
  cart[k] = Math.min(99, (cart[k] || 0) + (qty || 1));
  saveState(); syncBadges("cart");
  if(!silent) showToast(t("toast_added"));
}
function setQty(key, qty){
  if(qty <= 0) delete cart[key]; else cart[key] = Math.min(99, qty);
  saveState(); syncBadges();
}
function clearCart(){ cart = {}; promo = null; saveState(); syncBadges(); }
function cartLines(){
  return Object.keys(cart).map(k => {
    const parts = k.split(":").map(Number);
    const p = PRODUCTS.find(x => x.id === parts[0]);
    if(!p) return null;
    const vi = parts[1] || 0, unit = unitPrice(p, vi);
    return {key:k, p, vi, qty:cart[k], unit, sum:unit * cart[k]};
  }).filter(Boolean);
}
function cartTotals(){
  const lines = cartLines();
  const subtotal = lines.reduce((a, l) => a + l.sum, 0);
  const discount = promo ? Math.round(subtotal * promo.percent / 100) : 0;
  return {lines, subtotal, discount, total: subtotal - discount, count: lines.reduce((a, l) => a + l.qty, 0)};
}
function lineVariant(l){
  const v = extraOf(l.p).variants[l.vi];
  return v ? vLabel(v) : "";
}

/* ---------------- orders → Telegram ---------------- */
function tgEscape(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function makeOrderNo(){ return "MX-" + Date.now().toString(36).toUpperCase().slice(-6); }

async function sendTelegram(text){
  if(!TG.chatId) throw new Error("TG.chatId is empty — set your Telegram chat id in the code");
  const r = await fetch("https://api.telegram.org/bot" + TG.token + "/sendMessage", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({chat_id: TG.chatId, text: text.slice(0, 4000), parse_mode: "HTML", disable_web_page_preview: true})
  });
  const j = await r.json();
  if(!j.ok) throw new Error(j.description || "Telegram error");
  return j.result;
}

function buildOrderMessage(o){
  const money = n => n.toLocaleString("ru-RU") + " " + I18N.ru.currency;
  const langName = o.lang === "ru" ? "RU" : (o.lang === "cyrl" ? "ЎЗ (кириллица)" : "UZ (латиница)");
  const lines = o.items.map((it, i) => {
    const p = PRODUCTS.find(x => x.id === it.id);
    const v = p && extraOf(p).variants[it.vi];
    return (i + 1) + ". " + tgEscape(p ? p.name_ru : "#" + it.id) + (v ? tgEscape(" (" + vLabelRu(v) + ")") : "") +
      " — " + it.qty + " × " + money(it.unit) + " = " + money(it.unit * it.qty);
  }).join("\n");
  return "🛍 <b>Новый заказ " + o.no + "</b>\n\n" +
    "👤 <b>Имя:</b> " + tgEscape(o.name) + "\n" +
    "📞 <b>Телефон:</b> " + tgEscape(o.phone) + "\n" +
    "📍 <b>Адрес:</b> " + tgEscape(o.address) + "\n" +
    (o.comment ? "💬 <b>Комментарий:</b> " + tgEscape(o.comment) + "\n" : "") +
    "💳 <b>Оплата:</b> " + (o.pay === "card" ? "Картой" : "Наличными") + "\n" +
    "🌐 <b>Язык сайта:</b> " + langName + "\n\n" +
    "<b>Товары:</b>\n" + lines + "\n\n" +
    (o.promo ? "🏷 Промокод " + tgEscape(o.promo) + " (−" + o.percent + "%): −" + money(o.discount) + "\n" : "") +
    "💰 <b>Итого: " + money(o.total) + "</b>\n" +
    "🕒 " + new Date(o.ts).toLocaleString("ru-RU", {timeZone: "Asia/Tashkent"});
}

async function placeOrder(form){
  const T = cartTotals();
  if(!T.lines.length) throw new Error("empty cart");
  const order = {
    no: makeOrderNo(), ts: Date.now(),
    name: form.name.trim(), phone: form.phone.trim(), address: form.address.trim(), comment: (form.comment || "").trim(), pay: form.pay,
    lang: currentLang,
    items: T.lines.map(l => ({id: l.p.id, vi: l.vi, qty: l.qty, unit: l.unit})),
    subtotal: T.subtotal, discount: T.discount, total: T.total,
    promo: promo ? promo.code : null, percent: promo ? promo.percent : 0,
    status: "sent"
  };
  await sendTelegram(buildOrderMessage(order));
  orders.unshift(order);
  cart = {}; promo = null;
  if(!account.name) account.name = order.name;
  if(!account.phone) account.phone = order.phone;
  account.address = order.address;
  saveState(); syncBadges();
  return order;
}

async function sendContactMessage(d){
  const msg = "📩 <b>Сообщение с сайта</b>\n\n" +
    "👤 <b>Имя:</b> " + tgEscape(d.name) + "\n" +
    "📞 <b>Контакт:</b> " + tgEscape(d.contact) + "\n" +
    "💬 <b>Сообщение:</b> " + tgEscape(d.message) + "\n" +
    "🕒 " + new Date().toLocaleString("ru-RU", {timeZone: "Asia/Tashkent"});
  return sendTelegram(msg);
}

/* ---------------- promo ---------------- */
function applyPromoCode(code){
  code = String(code || "").trim().toUpperCase();
  if(PROMO_CODES[code]){ promo = {code, percent: PROMO_CODES[code]}; saveState(); return promo; }
  return null;
}

/* ---------------- scroll reveal ---------------- */
let revealObserver = null;
function observeReveals(){
  if(!("IntersectionObserver" in window)){ $$(".reveal").forEach(el => el.classList.add("in")); return; }
  if(!revealObserver){
    revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(en => { if(en.isIntersecting){ en.target.classList.add("in"); revealObserver.unobserve(en.target); } });
    }, {threshold: 0.12});
  }
  $$(".reveal:not(.in)").forEach(el => revealObserver.observe(el));
}

/* ---------------- boot / language ---------------- */
function boot(renderFn){
  window.__render = () => { if(renderFn) renderFn(); applyStaticI18n(); observeReveals(); };
  document.documentElement.lang = currentLang === "ru" ? "ru" : "uz";
  renderHeader(); renderFooter();
  window.__render();
}
function setLang(lang){
  currentLang = lang;
  saveState();
  document.documentElement.lang = lang === "ru" ? "ru" : "uz";
  renderHeader(); renderFooter();
  window.__render();
}


/* ---------------- shared review card ---------------- */
function reviewCardHTML(r){
  const name = r.u ? r.n : nameFor(r.n);
  const text = r.u ? r.text : (currentLang === "ru" ? r.ru : (currentLang === "cyrl" ? uzToCyr(r.uz) : r.uz));
  const sub = r.u ? new Date(r.date).toLocaleDateString("ru-RU") : "";
  return `<div class="review-card">

      <div class="review-avatar">${esc(name.charAt(0).toUpperCase())}</div>
      <div><div class="review-name">${esc(name)}</div>${sub ? `<div class="review-cat">${sub}</div>` : ''}</div>
    </div>
    <div class="p-stars">${starsHTML(r.r)}</div>
    <p>${esc(text)}</p>
  </div>`;
}
